name: AI4 isolated failure acceptance
on:
  workflow_dispatch:
    inputs:
      inject_failure:
        description: Fail only the isolated hosted test job, with exit 42
        required: true
        type: boolean
        default: false
permissions: {}
jobs:
  isolated-test:
    if: github.ref == 'refs/heads/ai4/controlled-failure-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: AI4 controlled failure (exit 42)
        if: inputs.inject_failure
        run: |
          echo 'AI4 controlled-test-exit-42; no checkout, credentials, business or network calls'
          exit 42
      - name: AI4 recovery (exit 0)
        if: ${{ !inputs.inject_failure }}
        run: echo 'AI4 isolated acceptance test recovered; exit 0'
