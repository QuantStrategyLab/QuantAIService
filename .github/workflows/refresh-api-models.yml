name: Refresh API Tier Models

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      open_issue:
        description: 'Create or update a tracking issue when model candidates change'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: refresh-api-models
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project dependencies
        run: python -m pip install .
      - name: Refresh API tier model candidates
        id: refresh
        run: |
          PYTHONPATH=src python3 scripts/refresh_api_models.py \
            --policy config/api-tier-models.json \
            --output "$RUNNER_TEMP/api-tier-models.json" \
            > "$RUNNER_TEMP/refresh-report.json"

          python3 - "$RUNNER_TEMP/refresh-report.json" "$RUNNER_TEMP/api-tier-models.json" "$RUNNER_TEMP/issue-body.md" "$RUNNER_TEMP/pr-body.md" <<'PY'
          import difflib
          import json
          import os
          import pathlib
          import sys

          report_path, updated_path, body_path, pr_body_path = map(pathlib.Path, sys.argv[1:5])
          report = json.loads(report_path.read_text(encoding='utf-8'))
          current_policy = json.loads(pathlib.Path('config/api-tier-models.json').read_text(encoding='utf-8'))
          updated_policy = json.loads(updated_path.read_text(encoding='utf-8'))
          changed = current_policy != updated_policy
          current_norm = json.dumps(current_policy, indent=2) + '\n'
          updated_norm = json.dumps(updated_policy, indent=2) + '\n'

          lines = [
              '## API Tier Model Refresh',
              '',
              '| Provider | Tier | Source | Changed | Candidates |',
              '| --- | --- | --- | --- | --- |',
          ]
          for provider, tiers in sorted(report.get('tiers', {}).items()):
              for tier in ('simple', 'standard', 'complex'):
                  entry = tiers.get(tier, {})
                  cands = ', '.join(f'`{m}`' for m in entry.get('candidates', []))
                  lines.append(
                      f"| `{provider}` | `{tier}` | `{entry.get('source', 'unknown')}` "
                      f"| `{entry.get('changed', False)}` | {cands} |"
                  )

          diff_block: list[str] = []
          if changed:
              diff_lines = list(difflib.unified_diff(
                  current_norm.splitlines(),
                  updated_norm.splitlines(),
                  fromfile='config/api-tier-models.json',
                  tofile='refreshed/api-tier-models.json',
                  lineterm='',
              ))
              diff_block = [
                  '',
                  '### Proposed Diff',
                  '```diff',
                  *diff_lines,
                  '```',
              ]
              lines.extend([
                  *diff_block,
                  '',
                  'To apply locally and open a PR:',
                  '```bash',
                  'PYTHONPATH=src python3 scripts/refresh_api_models.py --policy config/api-tier-models.json',
                  '```',
              ])
          else:
              lines.extend(['', 'No changes detected against `config/api-tier-models.json`.'])

          summary = '\n'.join(lines) + '\n'
          body_path.write_text(summary, encoding='utf-8')
          pr_sections = [
              '## AI assistance',
              '',
              'None (automated scheduled pricing policy refresh).',
              '',
              '## What changed',
              '',
              'Refreshed `config/api-tier-models.json` from official provider pricing documents.',
              '',
              *lines,
              '',
              '## How verified',
              '',
              '- Executed `scripts/refresh_api_models.py --policy config/api-tier-models.json` cleanly.',
              '- Automated repository CI and reviewer checks verify schema and tests on this PR.',
              '',
              '## Why',
              '',
              'Keep approved API tier model rosters aligned with newly released and deprecated provider models without manual edits.',
              '',
              '## Risk',
              '',
              '- Tier: R1 (`config/api-tier-models.json` policy update within configured `rate_caps`).',
          ]
          pr_body_path.write_text('\n'.join(pr_sections) + '\n', encoding='utf-8')

          step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if step_summary:
              with open(step_summary, 'a', encoding='utf-8') as fh:
                  fh.write(summary)
          gh_output = os.environ.get('GITHUB_OUTPUT')
          if gh_output:
              with open(gh_output, 'a', encoding='utf-8') as fh:
                  fh.write(f"changed={'true' if changed else 'false'}\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-tier-models-refresh-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/api-tier-models.json
            ${{ runner.temp }}/refresh-report.json
          retention-days: 30
      - name: Auto-create and enable auto-merge PR on model changes
        id: auto_pr
        if: ${{ steps.refresh.outputs.changed == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.open_issue == true) }}
        env:
          PR_TOKEN: ${{ secrets.MODEL_REFRESH_PR_TOKEN }}
        run: |
          if [[ -z "${PR_TOKEN:-}" ]]; then
            echo "handled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="chore/refresh-api-tier-models"
          PR_TITLE="chore: refresh API tier model candidates"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$RUNNER_TEMP/api-tier-models.json" config/api-tier-models.json
          git checkout -B "$BRANCH"
          git add config/api-tier-models.json
          if git diff --cached --quiet; then
            echo "handled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "$PR_TITLE"

          ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "${PR_TOKEN}" ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          trap 'rm -f "$ASKPASS"' EXIT

          REMOTE_URL="https://github.com/${GITHUB_REPOSITORY}.git"
          REMOTE_OID=$(GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git ls-remote --heads "$REMOTE_URL" "$BRANCH" | awk '{print $1}')
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git push --force-with-lease="refs/heads/$BRANCH:${REMOTE_OID:-}" "$REMOTE_URL" "HEAD:refs/heads/$BRANCH"

          export GH_TOKEN="$PR_TOKEN"
          EXISTING_PR=$(gh pr list --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING_PR" ]]; then
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
            gh pr comment "$EXISTING_PR" --body "@codex review" || true
            PR_NUM="$EXISTING_PR"
          else
            PR_URL=$(gh pr create --base main --head "$BRANCH" --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pr-body.md")
            PR_NUM=$(gh pr view "$PR_URL" --json number --jq '.number')
          fi
          gh pr merge "$PR_NUM" --auto --squash --delete-branch
          echo "handled=true" >> "$GITHUB_OUTPUT"
      - name: Create or update tracking issue on model changes
        if: ${{ steps.refresh.outputs.changed == 'true' && steps.auto_pr.outputs.handled != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.open_issue == true) }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: '[API Models] Refresh config/api-tier-models.json'
        run: |
          existing=$(gh issue list \
            --state open \
            --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title \
            --jq '.[] | select(.title == env.ISSUE_TITLE) | .number' | head -n 1)
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/issue-body.md"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue-body.md"
          fi
