name: Refresh API Tier Models

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      open_issue:
        description: 'Create or update a tracking issue when model candidates change'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: refresh-api-models
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project dependencies
        run: python -m pip install .
      - name: Refresh API tier model candidates
        id: refresh
        env:
          OPENAI_PRICING_ORIGIN: ${{ vars.OPENAI_PRICING_ORIGIN }}
          ANTHROPIC_PRICING_ORIGIN: ${{ vars.ANTHROPIC_PRICING_ORIGIN }}
          GEMINI_PRICING_ORIGIN: ${{ vars.GEMINI_PRICING_ORIGIN }}
        run: |
          PYTHONPATH=src python3 scripts/refresh_api_models.py \
            --policy config/api-tier-models.json \
            --output "$RUNNER_TEMP/api-tier-models.json" \
            > "$RUNNER_TEMP/refresh-report.json"

          python3 - "$RUNNER_TEMP/monthly-audit-models.json" "$RUNNER_TEMP/monthly-report.json" <<'PY'
          import json
          import pathlib
          import sys
          from scripts.review_model_policy import refresh_candidates

          out_path, rep_path = map(pathlib.Path, sys.argv[1:3])
          policy = json.loads(pathlib.Path('config/monthly-audit-models.json').read_text(encoding='utf-8'))
          updated = json.loads(json.dumps(policy))
          report = {}
          empty = []
          for tier in ('standard', 'complex'):
              report[tier] = {}
              for provider in ('openai', 'anthropic'):
                  candidates, source = refresh_candidates(provider, tier, policy)
                  updated[tier][provider] = candidates
                  report[tier][provider] = {
                      'source': source,
                      'changed': candidates != list(policy[tier][provider]),
                      'candidates': candidates,
                  }
                  if not candidates:
                      empty.append(f'{tier}.{provider}')
          if not empty:
              out_path.write_text(json.dumps(updated, indent=2) + '\n', encoding='utf-8')
          rep_path.write_text(json.dumps({'tiers': report, 'empty_tiers': empty}, sort_keys=True), encoding='utf-8')
          if empty:
              raise SystemExit(1)
          PY

          python3 - "$RUNNER_TEMP/refresh-report.json" "$RUNNER_TEMP/api-tier-models.json" "$RUNNER_TEMP/monthly-report.json" "$RUNNER_TEMP/monthly-audit-models.json" "$RUNNER_TEMP/issue-body.md" "$RUNNER_TEMP/pr-body.md" <<'PY'
          import difflib
          import json
          import os
          import pathlib
          import sys

          report_path, updated_path, monthly_rep_path, monthly_updated_path, body_path, pr_body_path = map(pathlib.Path, sys.argv[1:7])
          report = json.loads(report_path.read_text(encoding='utf-8'))
          current_policy = json.loads(pathlib.Path('config/api-tier-models.json').read_text(encoding='utf-8'))
          updated_policy = json.loads(updated_path.read_text(encoding='utf-8'))
          monthly_report = json.loads(monthly_rep_path.read_text(encoding='utf-8'))
          current_monthly = json.loads(pathlib.Path('config/monthly-audit-models.json').read_text(encoding='utf-8'))
          updated_monthly = json.loads(monthly_updated_path.read_text(encoding='utf-8'))

          api_changed = current_policy != updated_policy
          monthly_changed = current_monthly != updated_monthly
          changed = api_changed or monthly_changed

          lines = [
              '## API Tier Model Refresh',
              '',
              '| Provider | Tier | Source | Changed | Candidates |',
              '| --- | --- | --- | --- | --- |',
          ]
          for provider, tiers in sorted(report.get('tiers', {}).items()):
              for tier in ('simple', 'standard', 'complex'):
                  entry = tiers.get(tier, {})
                  cands = ', '.join(f'`{m}`' for m in entry.get('candidates', []))
                  lines.append(
                      f"| `{provider}` | `{tier}` | `{entry.get('source', 'unknown')}` "
                      f"| `{entry.get('changed', False)}` | {cands} |"
                  )

          lines.extend([
              '',
              '## Monthly Audit Model Refresh',
              '',
              '| Tier | Provider | Source | Changed | Candidates |',
              '| --- | --- | --- | --- | --- |',
          ])
          for tier in ('standard', 'complex'):
              for provider in ('openai', 'anthropic'):
                  entry = monthly_report.get('tiers', {}).get(tier, {}).get(provider, {})
                  cands = ', '.join(f'`{m}`' for m in entry.get('candidates', []))
                  lines.append(
                      f"| `{tier}` | `{provider}` | `{entry.get('source', 'unknown')}` "
                      f"| `{entry.get('changed', False)}` | {cands} |"
                  )

          if changed:
              for label, cur_obj, upd_obj in (
                  ('config/api-tier-models.json', current_policy, updated_policy),
                  ('config/monthly-audit-models.json', current_monthly, updated_monthly),
              ):
                  if cur_obj == upd_obj:
                      continue
                  diff_lines = list(difflib.unified_diff(
                      (json.dumps(cur_obj, indent=2) + '\n').splitlines(),
                      (json.dumps(upd_obj, indent=2) + '\n').splitlines(),
                      fromfile=label,
                      tofile=f'refreshed/{label}',
                      lineterm='',
                  ))
                  lines.extend(['', f'### Proposed Diff ({label})', '```diff', *diff_lines, '```'])
          else:
              lines.extend(['', 'No changes detected against `config/api-tier-models.json` or `config/monthly-audit-models.json`.'])

          summary = '\n'.join(lines) + '\n'
          body_path.write_text(summary, encoding='utf-8')
          pr_sections = [
              '## AI assistance',
              '',
              'None (automated scheduled pricing policy refresh).',
              '',
              '## What changed',
              '',
              'Refreshed `config/api-tier-models.json` and `config/monthly-audit-models.json` from official provider pricing documents.',
              '',
              *lines,
              '',
              '## How verified',
              '',
              '- Executed `scripts/refresh_api_models.py --policy config/api-tier-models.json` and `scripts/review_model_policy.py` cleanly.',
              '- Automated repository CI and reviewer checks verify schema and tests on this PR.',
              '',
              '## Why',
              '',
              'Keep approved API tier and monthly audit model rosters aligned with newly released and deprecated provider models without manual edits.',
              '',
              '## Risk',
              '',
              '- Tier: R1 (pricing policy updates within configured `rate_caps`).',
          ]
          pr_body_path.write_text('\n'.join(pr_sections) + '\n', encoding='utf-8')

          step_summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if step_summary:
              with open(step_summary, 'a', encoding='utf-8') as fh:
                  fh.write(summary)
          gh_output = os.environ.get('GITHUB_OUTPUT')
          if gh_output:
              with open(gh_output, 'a', encoding='utf-8') as fh:
                  fh.write(f"changed={'true' if changed else 'false'}\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-tier-models-refresh-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/api-tier-models.json
            ${{ runner.temp }}/refresh-report.json
            ${{ runner.temp }}/monthly-audit-models.json
            ${{ runner.temp }}/monthly-report.json
          retention-days: 30
      - name: Auto-create and enable auto-merge PR on model changes
        id: auto_pr
        if: ${{ steps.refresh.outputs.changed == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.open_issue == true) }}
        env:
          PR_TOKEN: ${{ secrets.MODEL_REFRESH_PR_TOKEN }}
        run: |
          if [[ -z "${PR_TOKEN:-}" ]]; then
            echo "handled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="chore/refresh-api-tier-models"
          PR_TITLE="chore: refresh API tier model candidates"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          cat > "$ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "${PR_TOKEN}" ;;
          esac
          EOF
          chmod 700 "$ASKPASS"
          trap 'rm -f "$ASKPASS"' EXIT

          REMOTE_URL="https://github.com/${GITHUB_REPOSITORY}.git"
          export GH_TOKEN="$PR_TOKEN"
          EXISTING_PR=$(gh pr list --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING_PR" ]]; then
            GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git fetch --depth=1 "$REMOTE_URL" "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout -B "$BRANCH" "refs/remotes/origin/$BRANCH"
            if python3 -c "import json,pathlib,sys; eq=lambda a,b: json.loads(pathlib.Path(a).read_text('utf-8'))==json.loads(pathlib.Path(b).read_text('utf-8')); sys.exit(0 if eq('config/api-tier-models.json', sys.argv[1]) and eq('config/monthly-audit-models.json', sys.argv[2]) else 1)" "$RUNNER_TEMP/api-tier-models.json" "$RUNNER_TEMP/monthly-audit-models.json"; then
              gh pr merge "$EXISTING_PR" --auto --squash --delete-branch || true
              echo "handled=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cp "$RUNNER_TEMP/api-tier-models.json" config/api-tier-models.json
            cp "$RUNNER_TEMP/monthly-audit-models.json" config/monthly-audit-models.json
            git add config/api-tier-models.json config/monthly-audit-models.json
            if ! git diff --cached --quiet; then
              git commit -m "$PR_TITLE"
              GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git push "$REMOTE_URL" "HEAD:refs/heads/$BRANCH"
            fi
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
            gh pr comment "$EXISTING_PR" --body "@codex review" || true
            gh pr merge "$EXISTING_PR" --auto --squash --delete-branch || true
          else
            REMOTE_OID=$(GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git ls-remote --heads "$REMOTE_URL" "$BRANCH" | awk '{print $1}')
            if [[ -n "$REMOTE_OID" ]]; then
              GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git push "$REMOTE_URL" --delete "$BRANCH"
            fi
            cp "$RUNNER_TEMP/api-tier-models.json" config/api-tier-models.json
            cp "$RUNNER_TEMP/monthly-audit-models.json" config/monthly-audit-models.json
            git checkout -B "$BRANCH"
            git add config/api-tier-models.json config/monthly-audit-models.json
            if git diff --cached --quiet; then
              echo "handled=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "$PR_TITLE"
            GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git push "$REMOTE_URL" "HEAD:refs/heads/$BRANCH"
            PR_URL=$(gh pr create --base main --head "$BRANCH" --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pr-body.md")
            PR_NUM=$(gh pr view "$PR_URL" --json number --jq '.number')
            gh pr merge "$PR_NUM" --auto --squash --delete-branch
          fi
          echo "handled=true" >> "$GITHUB_OUTPUT"
      - name: Create or update tracking issue on model changes
        if: ${{ steps.refresh.outputs.changed == 'true' && steps.auto_pr.outputs.handled != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.open_issue == true) }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: '[API Models] Refresh config/api-tier-models.json'
        run: |
          existing=$(gh issue list \
            --state open \
            --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title \
            --jq '.[] | select(.title == env.ISSUE_TITLE) | .number' | head -n 1)
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/issue-body.md"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue-body.md"
          fi
