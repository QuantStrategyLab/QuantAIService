name: Azure monitor release
on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected release environment
        type: choice
        required: true
        options:
          - monitor-release
          - monitor-release-test
      operation:
        description: Release operation
        type: choice
        required: true
        default: verify
        options:
          - verify
          - deploy
          - rollback
permissions: {}
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    uses: QuantStrategyLab/.github/.github/workflows/deploy-job.yml@ec284d416698b3883a217b625b5ca1df8549b904
    with:
      provider: azure
      environment: ${{ inputs.target }}
      operation: ${{ inputs.operation }}
    secrets:
      DEPLOY_CLIENT_ID: ${{ secrets.DEPLOY_CLIENT_ID }}
      DEPLOY_TENANT_ID: ${{ secrets.DEPLOY_TENANT_ID }}
      DEPLOY_SUBSCRIPTION_ID: ${{ secrets.DEPLOY_SUBSCRIPTION_ID }}
      DEPLOY_RESOURCE: ${{ secrets.DEPLOY_RESOURCE }}
      DEPLOY_PREVIOUS_IMAGE: ${{ secrets.DEPLOY_PREVIOUS_IMAGE }}
      DEPLOY_CANDIDATE_IMAGE: ${{ secrets.DEPLOY_CANDIDATE_IMAGE }}
