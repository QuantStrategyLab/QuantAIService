name: QuantAIService V2 CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and test the independent task service
        run: |
          python -m pip install setuptools wheel ruff==0.15.22
          python -m ruff check src tests/task_service tests/test_quant_service_v2.py scripts/verify_release_install.py
          python -m compileall -q src
          python -m pip wheel --no-deps --no-build-isolation . -w dist
          python -m pip install dist/*.whl
          python -m pip check
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python -I scripts/verify_release_install.py --version "$version"
          python -m unittest discover -s tests/task_service -v
          python -m unittest discover -s tests -p test_quant_service_v2.py -v
      - name: Validate the synthetic briefing summary caller without external access
        env:
          PYTHONPATH: .:ops/quant-monitor
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pip install pytest
          python -m ruff check ops/quant-monitor/quant_monitor_domain/briefing_consumer.py ops/quant-monitor/quant_monitor_domain/briefing_summary_operation.py scripts/consume_daily_briefing.py tests/test_consume_daily_briefing.py tests/test_briefing_summary_operation.py
          python -m pytest -q -p no:cacheprovider tests/test_consume_daily_briefing.py tests/test_briefing_summary_operation.py
      - name: Validate SDK provenance and full setup refusal with offline fixtures
        run: |
          bash -n ops/quant-monitor/scripts/setup_vps_runtime.sh
          python -I -B ops/quant-monitor/tests/test_deploy_scripts.py -v \
            SDKDependencySetupTests \
            DeployScriptTests.test_runtime_setup_requires_exact_checkout_and_never_resyncs_aab_main \
            DeployScriptTests.test_staging_preflight_ignores_shared_mirror_python_startup \
            DeployScriptTests.test_staging_pip_and_backend_environment_ignore_shared_mirror
      - name: Validate read-only cloud monitor and portable delivery state
        run: |
          python -m ruff check ops/quant-monitor/scripts/cloud_run_health_job.py ops/quant-monitor/scripts/monitor_cloud_state.py ops/quant-monitor/scripts/monitor_diagnosis_state.py ops/quant-monitor/scripts/export_local_monitor_state.py ops/quant-monitor/tests/test_cloud_run_health_job.py ops/quant-monitor/tests/test_monitor_diagnosis_state.py
          python -m unittest discover -s ops/quant-monitor/tests -p test_cloud_run_health_job.py -v
          python -m unittest discover -s ops/quant-monitor/tests -p test_monitor_diagnosis_state.py -v
          python -m ruff check ops/quant-monitor/scripts/publish_saved_monitor_observation.py ops/quant-monitor/tests/test_observation_publisher.py
          PYTHONPATH=ops/quant-monitor/tests python -m unittest discover -s ops/quant-monitor/tests -p test_observation_publisher.py -v
          bash -n ops/quant-monitor/scripts/run_health_with_projection.sh
          python -m ruff check ops/quant-monitor/scripts/monitor_inputs.py ops/quant-monitor/scripts/monitor_findings.py ops/quant-monitor/tests/test_monitor_inputs.py ops/quant-monitor/tests/test_monitor_findings.py
          python -m unittest discover -s ops/quant-monitor/tests -p test_monitor_inputs.py -v
          python -m ruff check ops/quant-monitor/scripts/monitor_website_publish.py ops/quant-monitor/tests/test_monitor_website_publish.py
          python -m unittest discover -s ops/quant-monitor/tests -p test_monitor_website_publish.py -v
      - name: Validate SDK packages without monitor readiness in a temporary venv
        run: |
          pin=$(cat ops/quant-monitor/qpk-runtime.sha)
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          qpk="$RUNNER_TEMP/monitor-sdk-qpk"
          git init "$qpk"
          git -C "$qpk" fetch --depth=1 https://github.com/QuantStrategyLab/QuantPlatformKit.git "$pin"
          git -C "$qpk" checkout --detach FETCH_HEAD
          [[ "$(git -C "$qpk" rev-parse HEAD)" == "$pin" ]]
          # Package/source imports only; watcher imports do not qualify full
          # monitor readiness or invoke its issue-writing entrypoints.
          sdk_venv="$RUNNER_TEMP/monitor-sdk-packages-venv"
          python -I -m venv "$sdk_venv"
          env -u PYTHONPATH "$sdk_venv/bin/python" -I -m pip --isolated install \
            --index-url https://pypi.org/simple --require-hashes --only-binary=:all: \
            -r ops/quant-monitor/requirements-linux-py312.lock
          build_root=$(mktemp -d "$RUNNER_TEMP/monitor-sdk-qpk-archive.XXXXXX")
          trap 'rm -rf -- "$build_root"' EXIT
          git -C "$qpk" archive "$pin" | tar -x -C "$build_root"
          env -u PYTHONPATH "$sdk_venv/bin/python" -I -m pip --isolated install \
            --no-index --no-deps --no-build-isolation "$build_root"
          # Reuse the exact QAS wheel built earlier by this same CI checkout.
          env -u PYTHONPATH "$sdk_venv/bin/python" -I -m pip --isolated install \
            --no-index --no-deps dist/*.whl
          env -u PYTHONPATH "$sdk_venv/bin/python" -I -m pip --isolated check
          env -u PYTHONPATH "$sdk_venv/bin/python" -I - "$build_root" "$pin" <<'PY'
          import hashlib
          import importlib
          from importlib.metadata import distribution
          import json
          from pathlib import Path
          import sys
          import tomllib

          source = Path(sys.argv[1])
          prefix = Path(sys.prefix).resolve()
          package = distribution("quant-platform-kit")
          if package.version != tomllib.loads((source / "pyproject.toml").read_text())["project"]["version"]:
              raise ValueError("installed QPK version differs from reviewed archive")
          symbols = {
              "quant_platform_kit.strategy_lifecycle.watch.runner": "dispatch_strategy_watch_findings",
              "quant_platform_kit.strategy_lifecycle.watch.strategy_watch": "build_strategy_monitoring_finding",
          }
          for name, symbol in symbols.items():
              module = importlib.import_module(name)
              relative = name.replace('.', '/') + '.py'
              installed = Path(module.__file__).resolve()
              if (not installed.is_relative_to(prefix)
                      or installed != Path(package.locate_file(relative)).resolve()
                      or hashlib.sha256(installed.read_bytes()).digest()
                      != hashlib.sha256((source / 'src' / relative).read_bytes()).digest()
                      or not callable(getattr(module, symbol, None))):
                  raise ValueError("installed watcher entrypoint provenance mismatch")
          print(json.dumps({"source_pin": sys.argv[2], "installed_watcher_modules_checked": len(symbols),
                            "watcher_entrypoints_checked": len(symbols), "watcher_invoked": False}, sort_keys=True))
          PY
          version=$(python -I -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          env -u PYTHONPATH "$sdk_venv/bin/python" -I scripts/verify_release_install.py --version "$version"
          env -u PYTHONPATH "$sdk_venv/bin/python" -I -m unittest discover -s ops/quant-monitor/tests -p test_monitor_findings.py -v
          echo 'SDK package checks complete; full monitor readiness is not qualified.'
      - name: Validate monitor tests with explicit optional-dependency skips
        env:
          PYTHONPATH: ops/quant-monitor
        run: python -m unittest discover -s tests -v
      - name: Validate daily release adoption without cloud access
        run: |
          python -m pip install pytest
          bash -n ops/quant-monitor/scripts/adopt_daily_briefing_release.sh
          python -m pytest -q ops/quant-monitor/tests/test_adopt_daily_briefing_release.py ops/quant-monitor/tests/test_install_immutable_release.py ops/quant-monitor/tests/test_runtime_daily_pipeline.py
          python -m pytest -q ops/quant-monitor/tests/test_recent_diagnosis.py
          python -m ruff check scripts/diagnose_monitor_oidc.py tests/test_diagnose_monitor_oidc.py
          python -m pytest -q tests/test_diagnose_monitor_oidc.py
          python -m pytest -q ops/quant-monitor/tests/test_monitor_fail_closed.py -k operational_diagnosis
          python -m pytest -q ops/quant-monitor/tests/test_q04_synthetic_caller.py ops/quant-monitor/tests/test_monitor_fail_closed.py::MonitorFailClosedTests::test_historical_rehearsal_requires_explicit_synthetic_context
          python -m ruff check ops/quant-monitor/scripts/sync_lifecycle_artifacts.py ops/quant-monitor/tests/test_lifecycle_artifact_sync.py
          # Reuse the verified SDK venv for guarded monitor and persistence regressions.
          env -i TZ=UTC TMPDIR="$RUNNER_TEMP" "$RUNNER_TEMP/monitor-sdk-packages-venv/bin/python" -I -B - <<'PY'
          import importlib.util
          import sys
          import unittest

          blocked = []
          def audit(event, _args):
              if event.startswith("socket.") or event in {
                  "subprocess.Popen", "os.system", "os.exec", "os.posix_spawn",
                  "os.fork", "pty.spawn", "ctypes.dlopen",
              }:
                  blocked.append(event)
                  raise PermissionError("external/process/native disabled")

          sys.addaudithook(audit)
          path = "ops/quant-monitor/tests/test_monitor_fail_closed.py"
          spec = importlib.util.spec_from_file_location("monitor_positive_ci_tests", path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "MonitorFailClosedTests.test_health_cycle_nonempty_finding_reaches_fake_issue_and_json_readback",
              "MonitorFailClosedTests.test_health_cycle_nonempty_finding_query_failure_blocks_create_and_reports_error",
              "MonitorFailClosedTests.test_shared_status_failure_distinguishes_missing_invalid_stale_and_future",
              "MonitorFailClosedTests.test_live_failure_message_preserves_both_evidence_gaps_in_plain_text",
              "MonitorFailClosedTests.test_alert_locale_env_and_duplicate_evidence",
              "MonitorFailClosedTests.test_telegram_transport_sends_plain_text_without_extra_escaping",
          ], module)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print({"tests_run": result.testsRun, "skips": len(result.skipped), "blocked": len(blocked)})
          if not (result.wasSuccessful() and result.testsRun == 6 and not result.skipped and not blocked):
              raise SystemExit(1)
          for path, names in [
              ("ops/quant-monitor/tests/test_monitor_inputs.py", [
                  "SourceSummaryTests.test_partial_and_missing_source_are_unknown_after_commit",
                  "SourceSummaryTests.test_ready_requires_fresh_status_and_complete_matching_archive_binding",
                  "SourceSummaryTests.test_archive_failure_is_visible_after_refresh_and_commit",
              ]),
              ("ops/quant-monitor/tests/test_cloud_run_health_job.py", [
                  "CloudJobTests.test_cloud_refresh_logs_safe_source_summary_from_adapter",
                  "CloudJobTests.test_source_summary_log_failure_does_not_block_input_consumption",
              ]),
          ]:
              spec = importlib.util.spec_from_file_location("source_readiness_ci_tests", path)
              assert spec is not None and spec.loader is not None
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              suite = unittest.defaultTestLoader.loadTestsFromNames(names, module)
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              print({"source_readiness_tests_run": result.testsRun, "skips": len(result.skipped),
                     "blocked": len(blocked)})
              if not (result.wasSuccessful() and result.testsRun == len(names) and not result.skipped and not blocked):
                  raise SystemExit(1)
          path = "ops/quant-monitor/tests/test_lifecycle_artifact_sync.py"
          spec = importlib.util.spec_from_file_location("artifact_failure_ci_tests", path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "LifecycleArtifactSyncTests.test_main_retains_failed_selected_source_and_still_blocks_health_coverage",
              "LifecycleArtifactSyncTests.test_failed_source_identity_is_atomic_and_drops_unrelated_material",
              "LifecycleArtifactSyncTests.test_shared_or_non_artifact_error_never_copies_selected_source",
          ], module)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print({"artifact_failure_tests_run": result.testsRun, "skips": len(result.skipped), "blocked": len(blocked)})
          if not (result.wasSuccessful() and result.testsRun == 3 and not result.skipped and not blocked):
              raise SystemExit(1)
          import hashlib
          import os
          from importlib.metadata import distribution
          from pathlib import Path
          import quant_platform_kit.strategy_lifecycle.performance_store as store
          qpk = Path(os.environ["TMPDIR"]) / "monitor-sdk-qpk"
          installed = Path(store.__file__).resolve()
          package = distribution("quant-platform-kit")
          relative = "quant_platform_kit/strategy_lifecycle/performance_store.py"
          if (not installed.is_relative_to(Path(sys.prefix).resolve())
                  or installed != Path(package.locate_file(relative)).resolve()
                  or hashlib.sha256(installed.read_bytes()).digest()
                  != hashlib.sha256((qpk / "src" / relative).read_bytes()).digest()):
              raise ValueError("installed atomic writer provenance mismatch")
          print({"atomic_writer_module_checked": 1})
          spec = importlib.util.spec_from_file_location("atomic_writer_ci_tests", qpk / "tests/test_lifecycle_atomic_json.py")
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          suite = unittest.defaultTestLoader.loadTestsFromModule(module)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print({"atomic_json_tests_run": result.testsRun, "skips": len(result.skipped), "blocked": len(blocked)})
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun == 7
                           and not result.skipped and not blocked else 1)
          PY
      - name: Test Quant deployment controls without VPS access
        run: |
          python -m ruff check deploy/vps/ci-deploy tests/test_vps_deploy.py
          python -m unittest discover -s tests -p test_vps_deploy.py -v
      - name: Build reviewable Linux bundle without deploying
        run: |
          mkdir -p release/wheels
          python -m pip download --only-binary=:all: \
            --platform manylinux2014_x86_64 --platform manylinux_2_17_x86_64 \
            --implementation cp --python-version 3.12 --dest release/wheels dist/*.whl
          python deploy/vps/ci-deploy/ci_release.py build --root release --out quant-vps-bundle \
            --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID$GITHUB_RUN_ATTEMPT"
      - name: Smoke test the exact hash-pinned Linux bundle offline
        run: |
          python -m venv "$RUNNER_TEMP/quant-bundle-smoke"
          "$RUNNER_TEMP/quant-bundle-smoke/bin/python" -I -m pip --isolated install \
            --no-index --no-deps --only-binary=:all: --require-hashes --no-cache-dir \
            --find-links release/wheels -r release/requirements.txt
          "$RUNNER_TEMP/quant-bundle-smoke/bin/python" -I -m pip --isolated check
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          "$RUNNER_TEMP/quant-bundle-smoke/bin/python" -I scripts/verify_release_install.py --version "$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quant-vps-bundle
          path: quant-vps-bundle/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: quant-ai-service-v2-unpublished
          path: dist/*.whl
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate workflows
        uses: docker://rhysd/actionlint:1.7.12
      - name: Test monthly evidence report without external access
        run: python3 -m unittest tests.test_monthly_audit_report -v
