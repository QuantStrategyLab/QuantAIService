name: Monthly Audit Evidence Report

on:
  schedule:
    - cron: '17 4 3 * *'
  workflow_dispatch:
    inputs:
      api_probe:
        description: 'Run one synthetic request per model, without source collection or issue publication'
        type: boolean
        default: false
      probe_provider:
        description: 'Provider to verify for a synthetic probe'
        type: choice
        options: [both, all, openai, anthropic, gemini]
        default: both
      month:
        description: 'Report month (YYYY-MM); empty uses current UTC month'
        required: false
        default: ''
      dry_run:
        description: 'Read evidence only; do not create an issue'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: monthly-audit-evidence
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Collect source-owned monthly evidence
        if: ${{ !inputs.api_probe }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_MONTH: ${{ inputs.month }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: |
          arguments=()
          if [[ "$DRY_RUN" == "false" ]]; then
            arguments+=(--publish)
          fi
          python scripts/monthly_audit_report.py --month "$REPORT_MONTH" "${arguments[@]}" > "$RUNNER_TEMP/qar-monthly.json"
      - name: Run independent AI audits
        if: ${{ github.repository == 'QuantStrategyLab/QuantAIService' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && (inputs.api_probe || (github.event_name == 'schedule' && vars.MONTHLY_API_AUDIT_READY == 'true')) }}
        env:
          OPENAI_PRICING_ORIGIN: ${{ vars.OPENAI_PRICING_ORIGIN }}
          ANTHROPIC_PRICING_ORIGIN: ${{ vars.ANTHROPIC_PRICING_ORIGIN }}
          GEMINI_PRICING_ORIGIN: ${{ vars.GEMINI_PRICING_ORIGIN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROBE_PROVIDER: ${{ inputs.probe_provider }}
          AUDIT_PROBE: ${{ inputs.api_probe }}
          PYTHONPATH: src
        run: |
          if [[ "$AUDIT_PROBE" == "true" ]]; then
            mode=(--probe --probe-provider "${PROBE_PROVIDER:-both}")
          else
            mode=(--report "$RUNNER_TEMP/qar-monthly.json")
          fi
          python scripts/monthly_api_audit.py "${mode[@]}" --output "$RUNNER_TEMP/qar-monthly-api.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !inputs.api_probe && always() }}
        with:
          name: qar-monthly-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/qar-monthly.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() && github.repository == 'QuantStrategyLab/QuantAIService' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && (inputs.api_probe || (github.event_name == 'schedule' && vars.MONTHLY_API_AUDIT_READY == 'true')) }}
        with:
          name: qar-monthly-api-${{ github.run_id }}
          path: ${{ runner.temp }}/qar-monthly-api.json
          retention-days: 90
          if-no-files-found: warn
