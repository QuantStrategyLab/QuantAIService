name: Quant monitor operational diagnosis
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      verify_native_only:
        description: Verify the native caller with synthetic input and no production ledger access
        type: boolean
        default: false
      verify_state_only:
        description: Check cloud state access without requesting a diagnosis
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: quant-monitor-operational-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'QuantStrategyLab/QuantAIService' && github.ref == 'refs/heads/main' && !inputs.verify_native_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QUANT_MONITOR_GCS_BUCKET: ${{ secrets.QUANT_MONITOR_GCS_BUCKET }}
      MONITOR_CORE_AZURE_URL: ${{ vars.QUANT_MONITOR_CORE_AZURE_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the existing hash-pinned runtime dependencies
        run: |
          python -m pip --isolated install --require-hashes --only-binary=:all: \
            -r ops/quant-monitor/requirements-linux-py312.lock
      - name: Validate cloud project configuration
        env:
          GCP_PROJECT_ID: ${{ vars.QUANT_MONITOR_GCP_PROJECT_ID }}
        run: |
          if ! [[ "$GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
            echo "::error::Set QUANT_MONITOR_GCP_PROJECT_ID to a valid project ID"
            exit 1
          fi
      - name: Validate private storage configuration
        run: |
          python3 -c 'import os; from scripts.diagnose_monitor_oidc import configured_bucket; configured_bucket(os.environ)'
      - name: Authenticate to the bounded cloud state
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.QUANT_MONITOR_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.QUANT_MONITOR_GCP_WIF_PROVIDER }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Authenticate the Azure observation reader
        if: env.MONITOR_CORE_AZURE_URL != ''
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          tenant-id: ${{ vars.QUANT_MONITOR_AZURE_TENANT_ID }}
          client-id: ${{ vars.QUANT_MONITOR_AZURE_DIAGNOSIS_CLIENT_ID }}
          allow-no-subscriptions: true
        env:
          AZURE_CORE_OUTPUT: none
      - name: Diagnose saved observation with native OIDC
        env:
          AI_SERVICE_DIAGNOSIS_READY: ${{ vars.AI_SERVICE_DIAGNOSIS_READY || 'false' }}
          AI_SERVICE_URL: ${{ vars.AI_SERVICE_URL }}
          AI_SERVICE_AUDIENCE: ${{ vars.AI_SERVICE_AUDIENCE }}
          AI_SERVICE_DIAGNOSIS_MODEL: ${{ vars.AI_SERVICE_DIAGNOSIS_MODEL }}
          AI_SERVICE_DIAGNOSIS_PROFILE: ${{ vars.AI_SERVICE_DIAGNOSIS_PROFILE || 'default' }}
          CODEX_AUDIT_SERVICE_URL: ${{ secrets.CODEX_AUDIT_SERVICE_URL }}
          CODEX_AUDIT_SERVICE_AUDIENCE: quant-codex-audit
          PYTHONDONTWRITEBYTECODE: '1'
          MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          VERIFY_STATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_state_only }}
        run: |
          set -euo pipefail
          if [[ -n "$MONITOR_CORE_AZURE_URL" ]]; then
            MONITOR_AZURE_BLOB_TOKEN="$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)"
            export MONITOR_AZURE_BLOB_TOKEN
          fi
          args=()
          if [ "$VERIFY_STATE_ONLY" = true ]; then
            args+=(--verify-state-only)
          elif [ "$MANUAL_DISPATCH" = true ]; then
            args+=(--include-healthy)
          fi
          python3 -B scripts/diagnose_monitor_oidc.py \
            --cloud \
            --receipt "$RUNNER_TEMP/operational-diagnosis-receipt.json" "${args[@]}"
      - name: Surface skipped vs completed diagnosis
        if: always()
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/operational-diagnosis-receipt.json"
          if [ ! -f "$receipt" ]; then
            echo "::error::Diagnosis receipt missing after the diagnose step."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, pathlib, sys
          receipt = pathlib.Path(os.environ["RUNNER_TEMP"]) / "operational-diagnosis-receipt.json"
          payload = json.loads(receipt.read_text())
          status = payload.get("status")
          reason = payload.get("reason")
          provider = payload.get("provider")
          model = payload.get("model")
          if status == "skipped":
              print(
                  f"::warning::Native diagnosis skipped ({reason or 'unspecified'}); "
                  "workflow success does not mean a Dot/Grokbot task completed."
              )
              sys.exit(0)
          if status == "succeeded":
              print(
                  f"::notice::Native diagnosis completed via provider={provider} model={model}."
              )
              sys.exit(0)
          if status == "verified":
              mode = payload.get("mode") or "unspecified"
              print(
                  f"::notice::Cloud state verification completed (mode={mode}); "
                  "no diagnosis task was submitted."
              )
              sys.exit(0)
          print(f"::error::Unexpected diagnosis receipt status={status!r} reason={reason!r}")
          sys.exit(1)
          PY
      - name: Save sanitized service receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operational-diagnosis-receipt
          path: ${{ runner.temp }}/operational-diagnosis-receipt.json
          if-no-files-found: error
          retention-days: 14

  verify-native:
    if: github.repository == 'QuantStrategyLab/QuantAIService' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.verify_native_only && !inputs.verify_state_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify the existing native caller with synthetic classification
        env:
          AI_SERVICE_DIAGNOSIS_READY: ${{ vars.AI_SERVICE_DIAGNOSIS_READY || 'false' }}
          AI_SERVICE_URL: ${{ vars.AI_SERVICE_URL }}
          AI_SERVICE_AUDIENCE: ${{ vars.AI_SERVICE_AUDIENCE }}
          AI_SERVICE_DIAGNOSIS_MODEL: ${{ vars.AI_SERVICE_DIAGNOSIS_MODEL }}
          AI_SERVICE_DIAGNOSIS_PROFILE: ${{ vars.AI_SERVICE_DIAGNOSIS_PROFILE || 'default' }}
        run: python3 -B scripts/verify_native_diagnosis.py --workspace "$RUNNER_TEMP/native-verification"
      - name: Save synthetic verification state and sanitized receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-diagnosis-verification
          path: ${{ runner.temp }}/native-verification
          if-no-files-found: error
          retention-days: 14
