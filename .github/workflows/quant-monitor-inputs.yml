name: Build one private monitor release

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    if: github.repository == 'QuantStrategyLab/QuantAIService' && github.ref == 'refs/heads/release/monitor-cloud-binding-45efcaa'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      packages: write
    env:
      BASE: ghcr.io/quantstrategylab/qsl-health-monitor-azure@sha256:3b039fa1c346af45b31847ff653afeef5c11ef92540ed1e49e04b0afb53ea410
      TARGET: ghcr.io/quantstrategylab/qsl-health-monitor-azure:release-45efcaa
      SOURCE_SHA: 45efcaaadcf0de0508d838f9f649d32b2dc84ed2
      PREVIOUS_FILE_SHA: 2185ddbd3674c6775adce3f530090212e3fd88d42c7adad417af412714f78aa0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 45efcaaadcf0de0508d838f9f649d32b2dc84ed2
          persist-credentials: false
      - name: Build and verify the one-file overlay
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          export DOCKER_CONFIG="$RUNNER_TEMP/monitor-registry-auth"
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          docker pull "$BASE"
          file=/app/monitor/scripts/cloud_run_health_job.py
          actual="$(docker run --rm --network=none --entrypoint sha256sum "$BASE" "$file" | cut -d' ' -f1)"
          test "$actual" = "$PREVIOUS_FILE_SHA"
          src=ops/quant-monitor/scripts/cloud_run_health_job.py
          ctx="$(mktemp -d "$RUNNER_TEMP/monitor-image.XXXXXX")"
          cp "$src" "$ctx/cloud_run_health_job.py"
          printf 'FROM %s\nCOPY --chown=65532:65532 cloud_run_health_job.py /app/monitor/scripts/\n' "$BASE" >"$ctx/Dockerfile"
          docker build --network=none --label "org.opencontainers.image.revision=$SOURCE_SHA" -t "$TARGET" "$ctx"
          actual="$(docker run --rm --network=none --entrypoint sha256sum "$TARGET" "$file" | cut -d' ' -f1)"
          test "$actual" = "$(sha256sum "$src" | cut -d' ' -f1)"
          docker run --rm --network=none -w /app/monitor/scripts --entrypoint python "$TARGET" -c 'import cloud_run_health_job; assert callable(cloud_run_health_job.cloud_binding)'
          docker push "$TARGET" | tee "$RUNNER_TEMP/monitor-push.log"
          digest="$(grep -oE 'digest: sha256:[a-f0-9]{64}' "$RUNNER_TEMP/monitor-push.log" | tail -1 | cut -d' ' -f2)"
          test -n "$digest"
          printf 'MONITOR_RELEASE_DIGEST=%s\n' "$digest"
