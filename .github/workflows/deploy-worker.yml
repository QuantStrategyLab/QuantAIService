name: Deploy Worker to production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install pinned tools, test and build without deployment credentials
        working-directory: cloudflare/task-service
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          npm install --prefix "$RUNNER_TEMP/worker-tools" --no-audit --no-fund wrangler@4.156.2
      - name: Generate and validate private configuration
        env:
          WORKER_CONFIG_JSON: ${{ secrets.WORKER_CONFIG_JSON }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
        run: python3 scripts/worker_deploy.py configure cloudflare/task-service
      - name: Deploy the approved configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          CI: 'true'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          umask 077
          if ! "$RUNNER_TEMP/worker-tools/node_modules/.bin/wrangler" deploy \
            --config cloudflare/task-service/.wrangler/production.json \
            > "$RUNNER_TEMP/worker-deploy.log" 2>&1; then
            echo '::error::Worker deployment failed; private Wrangler output suppressed. Do not retry an unknown result before readback.'
            exit 1
          fi
          echo 'Worker deployment command succeeded.'
      - name: Smoke health and optional read-only task endpoints
        env:
          SMOKE_TASKS_TOKEN: ${{ secrets.SMOKE_TASKS_TOKEN }}
        run: python3 scripts/worker_deploy.py smoke cloudflare/task-service
      - name: Remove private configuration and logs
        if: always()
        run: |
          rm -f cloudflare/task-service/.wrangler/production.json "$RUNNER_TEMP/worker-deploy.log"
          rm -rf "$HOME/.config/.wrangler/logs" "$HOME/.wrangler/logs"
